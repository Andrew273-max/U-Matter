<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U Matter - Events</title>
    <link rel="stylesheet" href="styles.css">
    <link rel ="icon" type="image" href="assets/icon.png">
</head>
<body class="home">
    <header>
        <ul>
            <li><a href="event_list.html">Events</a></li>
            <li><a href="fund_list.html">Funds</a></li>
            <li><a href="login_signup.html">Log in/Sign up</a></li>
        </ul>
    </header>
    <div class="hero">
        <h1>U Matter</h1>
        <h3>Organize. Protest. Win.</h3>
    </div>
    
    <section class="section">
        <div class="container">
            <div class="section-title">
                <h2>Get In Touch</h2>
            </div>
            
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    
                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <select id="topic" name="topic">
                            <option value="">Please select what the message is about:</option>
                            <option value="events">Event management</option>
                            <option value="funds">Fund management</option>
                            <option value="account">Account</option>
                            <option value="bugs">Bugs</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Your Message *</label>
                        <textarea id="message" name="message" placeholder="Tell us about your waste management needs..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-full">Send Message</button>
                </form>
                <div id="formMessage" class="form-message"></div>
            </div>
        </div>
    </section>
</body>
</html>
